.logo-name{font-size:15px;font-weight:700;}
.logo-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.nav{flex:1;padding:8px 12px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);cursor:pointer;color:var(--text2);font-size:13px;transition:all 0.12s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-badge{margin-left:auto;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:20px;background:var(--bg4);color:var(--text2);}
.nav-item.active .nav-badge{background:#fff;color:var(--red);}
.sidebar-footer{padding:16px 20px 0;border-top:1px solid var(--border);font-size:11px;color:var(--text3);font-family:var(--mono);}
.sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle;}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite;}
.sync-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
@keyframes spin{to{transform:rotate(360deg);}}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:16px;font-weight:500;}
.topbar-sub{font-size:12px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.topbar-actions{display:flex;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-family:var(--sans);cursor:pointer;transition:all 0.12s;border:1px solid var(--border2);background:var(--bg3);color:var(--text);}
.btn:hover{background:var(--bg4);}
.btn svg{width:14px;height:14px;}
.btn-accent{background:var(--accent);color:#fff;border-color:transparent;font-weight:500;}
.btn-accent:hover{background:var(--accent-hover);}
.btn-danger{color:var(--red);border-color:var(--red-dim);}
.btn-danger:hover{background:var(--red-dim);}
.content{padding:32px;flex:1;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;}
.stat-label{font-size:11px;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
.stat-val{font-size:28px;font-weight:300;font-family:var(--mono);}
.stat-val.green{color:var(--green);}
.stat-val.amber{color:var(--amber);}
.stat-val.red{color:var(--red);}
.stat-val.blue{color:var(--blue);}
.stat-desc{font-size:11px;color:var(--text3);margin-top:4px;}
.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{padding:5px 14px;border-radius:20px;font-size:12px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--sans);transition:all 0.1s;}
.filter-btn:hover{color:var(--text);}
.filter-btn.active{background:var(--accent);color:#fff;border-color:transparent;font-weight:500;}
.search-input{margin-left:auto;padding:6px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;font-family:var(--sans);outline:none;width:200px;}
.search-input:focus{border-color:var(--accent);}
.search-input::placeholder{color:var(--text3);}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
.sd-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:18px;cursor:pointer;transition:all 0.15s;position:relative;overflow:hidden;}
.sd-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;}
.sd-card.s-ledig::before{background:var(--green-line);}
.sd-card.s-ude::before{background:var(--amber-line);}
.sd-card.s-savnet::before{background:var(--red-line);}
.sd-card:hover{border-color:var(--border2);background:#fff;}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
.card-id{font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:0.05em;}
.badge{font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:20px;font-weight:500;text-transform:uppercase;}
.badge-ledig{background:var(--green-dim);color:var(--green);}
.badge-ude{background:var(--amber-dim);color:var(--amber);}
.badge-savnet{background:var(--red-dim);color:var(--red);}
.card-cap{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:10px;}
.card-info{font-size:12px;color:var(--text2);line-height:1.6;}
.card-info .person{color:var(--text);font-weight:500;}
.card-info .project{color:var(--blue);}
.card-date{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.log-table{width:100%;border-collapse:collapse;}
.log-table th{text-align:left;font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);padding:0 16px 12px;border-bottom:1px solid var(--border);}
.log-row{border-bottom:1px solid var(--border);transition:background 0.1s;}
.log-row:hover{background:var(--bg3);}
.log-row td{padding:12px 16px;font-size:13px;}
.log-time{font-family:var(--mono);font-size:11px;color:var(--text3);white-space:nowrap;}
.log-card-id{font-family:var(--mono);font-weight:500;}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;}
.qr-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:20px;text-align:center;}
.qr-item-id{font-family:var(--mono);font-size:14px;font-weight:500;margin-bottom:4px;margin-top:12px;}
.qr-item-cap{font-size:11px;color:var(--text3);font-family:var(--mono);}
.modal-overlay{position:fixed;inset:0;background:rgba(27,42,73,0.45);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px);}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:28px;width:420px;max-width:94vw;}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.modal-title{font-size:16px;font-weight:500;}
.modal-id{font-family:var(--mono);font-size:12px;color:var(--text3);}
.form-field{margin-bottom:16px;}
.form-label{font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);display:block;margin-bottom:6px;}
.form-input,.form-select{width:100%;background:#fff;border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;font-family:var(--sans);padding:9px 12px;outline:none;transition:border-color 0.12s;appearance:none;}
.form-input:focus,.form-select:focus{border-color:var(--accent);}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
.view{display:none;}
.view.active{display:block;}
.empty{text-align:center;padding:64px;color:var(--text3);font-size:13px;}
.prod-group{margin-bottom:28px;}
.prod-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;padding:14px 18px;background:var(--side);border:1px solid var(--side);border-radius:var(--r2);}
.prod-group-name{font-size:15px;font-weight:500;}
.prod-group-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.btn-returner-alle{background:transparent;color:var(--text);border:2px solid var(--text);border-radius:var(--r);padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--sans);white-space:nowrap;transition:all 0.12s;}
.btn-returner-alle:hover{background:var(--text);color:var(--bg2);}
.btn-returner-alle:disabled{opacity:0.5;cursor:not-allowed;}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
.loading-text{font-size:13px;color:var(--text3);font-family:var(--mono);}
select option{background:#fff;color:var(--text);}
@media print{.sidebar,.topbar,.filter-bar,.stats-grid,.topbar-actions{display:none!important;}.main{margin-left:0;}.content{padding:0;}.qr-grid{grid-template-columns:repeat(4,1fr);}.qr-item{border:1px solid #ccc;background:white;color:black;}.qr-item-id,.qr-item-cap{color:black;}}
</style>
</head>
<body>

<div class="loading-screen" id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">Forbinder til database…</div>
</div>

<aside class="sidebar">

      Oversigt <span class="nav-badge" id="badge-all">0</span>
    </button>
    <button class="nav-item" onclick="showView('ledig',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
      Ledige <span class="nav-badge" id="badge-ledig">0</span>
    </button>
    <button class="nav-item" onclick="showView('ude',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Ude <span class="nav-badge" id="badge-ude">0</span>
    </button>
    <button class="nav-item" onclick="showView('savnet',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Savnede <span class="nav-badge" id="badge-savnet">0</span>
    </button>
    <button class="nav-item" onclick="showView('log',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Aktivitetslog
    </button>
    <button class="nav-item" onclick="showView('qr',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3z"/><path d="M17 17h4"/><path d="M21 14v4"/></svg>
      QR-koder
    </button>
    <button class="nav-item" onclick="showView('fotografer',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Fotografer
    </button>
  </nav>
  <div class="sidebar-footer">
    <span class="sync-dot" id="sync-dot"></span><span id="sync-status">forbinder…</span><br>
    <span id="footer-date"></span>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="view-title">Alle SD-kort</div>
      <div class="topbar-sub" id="view-sub">Klik et kort for at tjekke ud/ind</div>
    </div>
    <div class="topbar-actions">
      <button class="btn" onclick="openScan()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 012-2h2"/><path d="M17 3h2a2 2 0 012 2v2"/><path d="M21 17v2a2 2 0 01-2 2h-2"/><path d="M7 21H5a2 2 0 01-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
        Scan QR
      </button>
      <button class="btn btn-accent" onclick="openAddCard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Tilf&oslash;j kort
      </button>
    </div>
  </div>
  <div class="content">
    <div class="view active" id="view-oversigt">
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-label">Total kort</div><div class="stat-val blue" id="s-total">—</div><div class="stat-desc">registrerede i systemet</div></div>
        <div class="stat-card"><div class="stat-label">Ledige</div><div class="stat-val green" id="s-ledig">—</div><div class="stat-desc">klar til brug</div></div>
        <div class="stat-card"><div class="stat-label">Ude på optagelse</div><div class="stat-val amber" id="s-ude">—</div><div class="stat-desc">hos fotografer</div></div>
        <div class="stat-card"><div class="stat-label">Savnede</div><div class="stat-val red" id="s-savnet">—</div><div class="stat-desc">ikke returneret</div></div>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('alle',this)">Alle</button>
        <button class="filter-btn" onclick="setFilter('ledig',this)">Ledige</button>
        <button class="filter-btn" onclick="setFilter('ude',this)">Ude</button>
        <button class="filter-btn" onclick="setFilter('savnet',this)">Savnede</button>
        <input class="search-input" type="text" placeholder="Søg kort-ID eller fotograf…" id="search-input" oninput="renderCards()">
      </div>
      <div class="card-grid" id="card-grid"></div>
    </div>
    <div class="view" id="view-ledig"><div class="card-grid" id="card-grid-ledig"></div></div>
    <div class="view" id="view-ude"><div class="card-grid" id="card-grid-ude"></div></div>
    <div class="view" id="view-savnet"><div class="card-grid" id="card-grid-savnet"></div></div>
    <div class="view" id="view-log">
      <table class="log-table">
        <thead><tr><th>Tidspunkt</th><th>Kort</th><th>Handling</th><th>Fotograf</th><th>Produktion</th></tr></thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
    <div class="view" id="view-qr">
      <div style="display:flex;gap:8px;margin-bottom:20px;">
        <button class="btn btn-accent" onclick="window.print()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="14" height="14"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print alle QR-koder
        </button>
      </div>
      <div class="qr-grid" id="qr-grid"></div>
    </div>
    <div class="view" id="view-fotografer">
      <div style="display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;">
        <div>
          <div style="font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:14px;">Aktive udlån</div>
          <div id="photographer-list"></div>
        </div>
        <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:20px;position:sticky;top:80px;">
          <div style="font-size:13px;font-weight:500;margin-bottom:16px;">Administrer fotografer</div>
          <div style="display:flex;gap:8px;margin-bottom:16px;">
            <input class="form-input" type="text" id="new-photo-input" placeholder="Fuldt navn…" style="flex:1;" onkeydown="if(event.key==='Enter')addPhotographer()">
            <button class="btn btn-accent" onclick="addPhotographer()" style="white-space:nowrap;padding:8px 14px;">+ Tilføj</button>
          </div>
          <div id="photographer-mgmt-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modal-area"></div>

<script>
// ── Config ────────────────────────────────────────────────
var SB_URL = 'https://aeyfwjptisufgghtzdpn.supabase.co/rest/v1';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFleWZ3anB0aXN1ZmdnaHR6ZHBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0ODU4NDYsImV4cCI6MjA5NjA2MTg0Nn0.CZoswGagx3BF-ynuInKoA8KqdFd6R2ItKhuL7QMbwjg';
var SITE_URL = 'https://malebermuda.github.io/BermudaSDkort-tracker/';

// ── Supabase fetch wrapper ────────────────────────────────
function sbFetch(path, method, body, extra) {
  var headers = {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY,
    'Content-Type': 'application/json'
  };
  if (extra) Object.assign(headers, extra);
  return fetch(SB_URL + path, {
    method: method || 'GET',
    headers: headers,
    body: body ? JSON.stringify(body) : undefined
  });
}

// ── State ─────────────────────────────────────────────────
var cards = [], photographers = [], activityLog = [];
var currentView = 'oversigt', currentFilter = 'alle';

// ── Sync indicator ────────────────────────────────────────
function setSyncing(on) {
  var dot = document.getElementById('sync-dot');
  var txt = document.getElementById('sync-status');
  if (!dot || !txt) return;
  dot.className = 'sync-dot' + (on ? ' syncing' : '');
  txt.textContent = on ? 'synkroniserer…' : 'synkroniseret';
}
function setError() {
  var dot = document.getElementById('sync-dot');
  var txt = document.getElementById('sync-status');
  if (!dot || !txt) return;
  dot.className = 'sync-dot error';
  txt.textContent = 'forbindelsesfejl';
}

// ── Error banner ──────────────────────────────────────────
function showError(msg) {
  var old = document.getElementById('err-banner');
  if (old) old.remove();
  var b = document.createElement('div');
  b.id = 'err-banner';
  b.style.cssText = 'position:fixed;bottom:20px;right:20px;background:var(--red-dim);color:var(--red);font-family:var(--sans);font-size:12px;padding:12px 16px;border-radius:8px;max-width:400px;z-index:9999;border:1px solid #f2b9ad;';
  b.innerHTML = '&times; ' + msg + ' <span onclick="this.parentNode.remove()" style="margin-left:12px;cursor:pointer;">&#10005;</span>';
  document.body.appendChild(b);
  setTimeout(function() { if (b.parentNode) b.remove(); }, 8000);
}

// ── Load all data ─────────────────────────────────────────
async function loadAll() {
  setSyncing(true);
  try {
    var r1 = await sbFetch('/cards?order=id');
    var r2 = await sbFetch('/photographers?order=name');
    var r3 = await sbFetch('/activity_log?order=ts.desc&limit=200');
    if (!r1.ok || !r2.ok || !r3.ok) throw new Error('HTTP fejl: ' + r1.status);
    cards = await r1.json();
    var ph = await r2.json();
    activityLog = await r3.json();
    photographers = ph.map(function(p) { return p.name; });
    document.getElementById('loading-screen').style.display = 'none';
    setSyncing(false);
    renderAll();
    setInterval(async function() {
      var ra = await sbFetch('/cards?order=id');
      var rb = await sbFetch('/activity_log?order=ts.desc&limit=200');
      if (ra.ok && rb.ok) {
        cards = await ra.json();
        activityLog = await rb.json();
        renderAll();
      }
    }, 120000);
  } catch(e) {
    setError();
    document.getElementById('loading-text').textContent = 'Fejl: ' + e.message;
  }
}

// ── Helpers ───────────────────────────────────────────────
// Udlånsdatoen bevares når kortet går fra Ude til Savnet (og når status ikke ændres)
function nextSince(oldStatus, oldSince, newStatus) {
  var today = new Date().toISOString().slice(0,10);
  if (newStatus === oldStatus && oldSince) return oldSince;
  if (oldStatus === 'ude' && newStatus === 'savnet' && oldSince) return oldSince;
  return today;
}
function fmtDate(s) {
  if (!s) return '';
  var d = new Date(s);
  return d.toLocaleDateString('da-DK', {day:'numeric', month:'short', year:'numeric'});
}
function nowTs() {
  var d = new Date();
  var p = function(n) { return n.toString().padStart(2,'0'); };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function fmtTs(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  var p = function(n) { return n.toString().padStart(2,'0'); };
  return p(d.getDate())+'-'+p(d.getMonth()+1)+'-'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function daysSince(s) {
  if (!s) return '';
  var diff = Math.floor((Date.now() - new Date(s)) / 86400000);
  if (diff === 0) return 'i dag';
  if (diff === 1) return 'i går';
  return diff + ' dage siden';
}

// ── Views ─────────────────────────────────────────────────
var viewTitles = {
  oversigt:['Alle SD-kort','Klik et kort for at tjekke ud/ind'],
  ledig:['Ledige kort','Klar til udlevering'],
  ude:['Ude på optagelse','Aktuelt udlånte SD-kort'],
  savnet:['Savnede kort','Mangler at blive returneret'],
  log:['Aktivitetslog','Komplet historik over ud- og indleveringer'],
  qr:['QR-koder','Print og klistre på kortene'],
  fotografer:['Fotografer','Oversigt og administration'],
};

function showView(name, btn) {
  currentView = name;
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var t = viewTitles[name] || [name, ''];
  document.getElementById('view-title').textContent = t[0];
  document.getElementById('view-sub').textContent = t[1];
  if (name === 'qr') renderQR();
  if (name === 'log') renderLog();
  if (name === 'fotografer') renderPhotographers();
  if (name === 'ledig' || name === 'ude' || name === 'savnet') renderFilteredCards(name);
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderCards();
}

// ── Card HTML ─────────────────────────────────────────────
function cardHTML(c) {
  var info = c.status === 'ude'
    ? '<span class="person">'+c.photographer+'</span><br><span class="project">'+c.project+'</span>'
    : c.status === 'savnet'
    ? '<span class="person">'+(c.project||c.photographer||'Ukendt produktion')+'</span><br><span style="color:var(--red);font-size:11px;">'+(c.notes||'Ingen noter')+'</span>'
    : '<span style="color:var(--green);">Klar til udlevering</span>';
  var badge = c.status === 'ledig' ? 'Ledig' : c.status === 'ude' ? 'Ude' : 'Savnet';
  return '<div class="sd-card s-'+c.status+'" onclick="openCardModal(\''+c.id+'\')">'
    +'<div class="card-top"><div class="card-id">'+c.id+'</div>'
    +'<span class="badge badge-'+c.status+'">'+badge+'</span></div>'
    +'<div class="card-cap">'+c.cap+'</div>'
    +'<div class="card-info">'+info+'</div>'
    +'<div class="card-date">'+(c.status==='ledig' ? 'Ledig siden '+fmtDate(c.since) : 'Udlånt '+fmtDate(c.since)+' · '+daysSince(c.since))+'</div>'
    +'</div>';
}

function renderCards() {
  var q = (document.getElementById('search-input') ? document.getElementById('search-input').value : '').toLowerCase();
  var f = cards;
  if (currentFilter !== 'alle') f = f.filter(function(c) { return c.status === currentFilter; });
  if (q) f = f.filter(function(c) { return c.id.toLowerCase().includes(q) || c.photographer.toLowerCase().includes(q) || c.project.toLowerCase().includes(q); });
  var grid = document.getElementById('card-grid');
  if (!grid) return;
  grid.innerHTML = f.length ? f.map(cardHTML).join('') : '<div class="empty">Ingen kort matcher søgningen</div>';
}

function renderFilteredCards(status) {
  var f = cards.filter(function(c) { return c.status === status; });
  var grid = document.getElementById('card-grid-'+status);
  if (!grid) return;
  if (!f.length) { grid.innerHTML = '<div class="empty">Ingen kort</div>'; return; }

  // "Ude"-visning: gruppér efter produktion med "Returner alle"-knap
  if (status === 'ude') {
    var byProject = {};
    f.forEach(function(c) {
      var key = c.project || '(Ingen produktion)';
      if (!byProject[key]) byProject[key] = [];
      byProject[key].push(c);
    });
    var html = '';
    Object.keys(byProject).sort().forEach(function(proj) {
      var cs = byProject[proj];
      var ids = cs.map(function(c) { return c.id; });
      html += '<div class="prod-group">'
        + '<div class="prod-group-header">'
        +   '<div>'
        +     '<div class="prod-group-name">' + proj + '</div>'
        +     '<div class="prod-group-sub">' + cs.length + ' kort ude</div>'
        +   '</div>'
        +   '<button class="btn-returner-alle" data-ids="' + ids.join(',') + '" data-proj="' + proj.replace(/"/g, '&quot;') + '">'
        +     '&#10003; Returner alle'
        +   '</button>'
        + '</div>'
        + '<div class="card-grid" style="margin-top:14px;">'
        + cs.map(cardHTML).join('')
        + '</div>'
        + '</div>';
    });
    grid.innerHTML = html;

    // Bind returner-alle knapper
    grid.querySelectorAll('.btn-returner-alle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var ids = btn.dataset.ids.split(',');
        var proj = btn.dataset.proj;
        returnerAlle(ids, proj, btn);
      });
    });
    return;
  }

  grid.innerHTML = f.map(cardHTML).join('');
}

async function returnerAlle(ids, projekt, btn) {
  if (!confirm('Returner ' + ids.length + ' kort fra "' + projekt + '" som ledige?')) return;
  btn.disabled = true;
  btn.textContent = 'Returnerer…';
  setSyncing(true);
  var today = new Date().toISOString().slice(0, 10);
  try {
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var card = cards.find(function(c) { return c.id === id; });
      await sbFetch('/cards?on_conflict=id', 'POST',
        {id: id, status: 'ledig', photographer: '', project: '', since: today, notes: card ? card.notes : '', cap: card ? card.cap : '128GB'},
        {'Prefer': 'return=representation,resolution=merge-duplicates'}
      );
      await sbFetch('/activity_log', 'POST',
        {card_id: id, action: 'returneret', photographer: '', project: projekt},
        {'Prefer': 'return=representation'}
      );
    }
    // Genindlæs
    var ra = await sbFetch('/cards?order=id');
    var rb = await sbFetch('/activity_log?order=ts.desc&limit=200');
    cards = await ra.json();
    activityLog = await rb.json();
    setSyncing(false);
    renderAll();
  } catch(e) {
    setSyncing(false);
    btn.disabled = false;
    btn.textContent = '&#10003; Returner alle';
    showError('Fejl ved returnering: ' + e.message);
  }
}

function renderStats() {
  var total = cards.length;
  var ledig = cards.filter(function(c) { return c.status === 'ledig'; }).length;
  var ude = cards.filter(function(c) { return c.status === 'ude'; }).length;
  var savnet = cards.filter(function(c) { return c.status === 'savnet'; }).length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-ledig').textContent = ledig;
  document.getElementById('s-ude').textContent = ude;
  document.getElementById('s-savnet').textContent = savnet;
  document.getElementById('badge-all').textContent = total;
  document.getElementById('badge-ledig').textContent = ledig;
  document.getElementById('badge-ude').textContent = ude;
  document.getElementById('badge-savnet').textContent = savnet;
}

// ── Log ───────────────────────────────────────────────────
function renderLog() {
  var body = document.getElementById('log-body');
  if (!body) return;
  if (!activityLog.length) { body.innerHTML = '<tr><td colspan="5" style="padding:40px;text-align:center;color:var(--text3)">Ingen aktivitet endnu</td></tr>'; return; }
  body.innerHTML = activityLog.map(function(l) {
    var col = l.action === 'udlaan' ? 'var(--amber)' : l.action === 'returneret' ? 'var(--green)' : 'var(--red)';
    var label = l.action === 'udlaan' ? 'UDLÅNT' : (l.action || '').toUpperCase();
    return '<tr class="log-row"><td class="log-time">'+fmtTs(l.ts)+'</td>'
      +'<td><span class="log-card-id">'+l.card_id+'</span></td>'
      +'<td><span style="color:'+col+';font-size:12px;font-family:var(--mono);">'+label+'</span></td>'
      +'<td style="color:var(--text2)">'+(l.photographer||'—')+'</td>'
      +'<td style="color:var(--text2)">'+(l.project||'—')+'</td></tr>';
  }).join('');
}

// ── QR ────────────────────────────────────────────────────
function renderQR() {
  var grid = document.getElementById('qr-grid');
  if (!grid) return;
  grid.innerHTML = '';
  cards.forEach(function(c) {
    var wrap = document.createElement('div');
    wrap.className = 'qr-item';
    var safeId = c.id.replace(/[^a-zA-Z0-9]/g, '');
    var url = SITE_URL + '?kort=' + encodeURIComponent(c.id);
    wrap.innerHTML = '<div id="qr-'+safeId+'" style="display:flex;justify-content:center;"></div>'
      +'<div class="qr-item-id">'+c.id+'</div>'
      +'<div class="qr-item-cap">'+c.cap+'</div>';
    grid.appendChild(wrap);
    setTimeout(function() {
      try { new QRCode(document.getElementById('qr-'+safeId), {text:url, width:130, height:130, colorDark:'#1b2a49', colorLight:'#ffffff'}); } catch(e) {}
    }, 50);
  });
}

// ── Fotografer ────────────────────────────────────────────
function renderPhotographers() {
  var el = document.getElementById('photographer-list');
  var mgmt = document.getElementById('photographer-mgmt-list');
  if (!el) return;
  var byPerson = {};
  cards.filter(function(c) { return c.status === 'ude'; }).forEach(function(c) {
    if (!byPerson[c.photographer]) byPerson[c.photographer] = [];
    byPerson[c.photographer].push(c);
  });
  el.innerHTML = Object.keys(byPerson).length
    ? Object.entries(byPerson).map(function(e) {
        var name = e[0], cs = e[1];
        return '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:20px;margin-bottom:12px;">'
          +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">'
          +'<div style="font-weight:500;">' + name + '</div>'
          +'<span style="background:var(--amber-dim);color:var(--amber);font-size:11px;font-family:var(--mono);padding:3px 10px;border-radius:20px;">'+cs.length+' kort ude</span></div>'
          +'<div style="display:flex;flex-wrap:wrap;gap:8px;">'
          +cs.map(function(c) { return '<div style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:8px 14px;">'
            +'<div style="font-family:var(--mono);font-size:13px;font-weight:500;">'+c.id+'</div>'
            +'<div style="font-size:11px;color:var(--blue);margin-top:2px;">'+c.project+'</div>'
            +'<div style="font-size:10px;color:var(--text3);margin-top:2px;">'+daysSince(c.since)+'</div></div>'; }).join('')
          +'</div></div>';
      }).join('')
    : '<div class="empty" style="padding:40px 0;">Ingen fotografer har kort ude</div>';
  if (!mgmt) return;
  mgmt.innerHTML = !photographers.length
    ? '<div style="font-size:12px;color:var(--text3);text-align:center;padding:20px 0;">Ingen fotografer tilføjet</div>'
    : photographers.slice().sort().map(function(p) {
        var hasCards = cards.some(function(c) { return c.photographer === p && c.status === 'ude'; });
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">'
          +'<div><div style="font-size:13px;">'+p+'</div>'
          +'<div style="font-size:10px;color:'+(hasCards?'var(--amber)':'var(--text3)')+';font-family:var(--mono);">'+(hasCards?'har kort ude':'ingen kort ude')+'</div></div>'
          +'<button onclick="removePhotographer(\''+p.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\',' + hasCards + ')" '
          +'style="background:none;border:none;cursor:pointer;padding:4px 8px;color:var(--text3);border-radius:var(--r);" '
          +'onmouseover="this.style.color=\'var(--red)\';this.style.background=\'var(--red-dim)\'" '
          +'onmouseout="this.style.color=\'var(--text3)\';this.style.background=\'none\'">&#128465;</button>'
          +'</div>';
      }).join('');
}

async function addPhotographer() {
  var input = document.getElementById('new-photo-input');
  var name = input.value.trim();
  if (!name) return;
  if (photographers.indexOf(name) !== -1) { input.style.borderColor = 'var(--red)'; setTimeout(function() { input.style.borderColor = ''; }, 1000); return; }
  setSyncing(true);
  var r = await sbFetch('/photographers?on_conflict=name', 'POST', {name: name}, {'Prefer': 'return=representation,resolution=merge-duplicates'});
  setSyncing(false);
  if (!r.ok) { showError('Kunne ikke tilføje fotograf'); return; }
  photographers.push(name);
  input.value = '';
  renderPhotographers();
}

async function removePhotographer(name, hasCards) {
  if (hasCards && !confirm(name + ' har kort ude. Fjern alligevel?')) return;
  setSyncing(true);
  await sbFetch('/photographers?name=eq.' + encodeURIComponent(name), 'DELETE');
  setSyncing(false);
  photographers = photographers.filter(function(p) { return p !== name; });
  renderPhotographers();
}

// ── Card modal ────────────────────────────────────────────
function openCardModal(id) {
  var c = cards.find(function(x) { return x.id === id; });
  var photoOpts = [''].concat(photographers).map(function(p) {
    return '<option value="'+p+'"'+(c.photographer===p?' selected':'')+'>'+( p || '— vælg fotograf —')+'</option>';
  }).join('');
  document.getElementById('modal-area').innerHTML =
    '<div class="modal-overlay" onclick="closeModal(event)">'
    +'<div class="modal" onclick="event.stopPropagation()">'
    +'<div class="modal-header"><div><div class="modal-title">'+c.id+' · '+c.cap+'</div>'
    +'<div class="modal-id">Rediger status og udlån</div></div>'
    +'<button class="btn" onclick="closeModal()" style="padding:6px 10px;">&#10005;</button></div>'
    +'<div class="form-field"><label class="form-label">Status</label>'
    +'<select class="form-select" id="m-status">'
    +'<option value="ledig"'+(c.status==='ledig'?' selected':'')+'>✓ Ledig</option>'
    +'<option value="ude"'+(c.status==='ude'?' selected':'')+'>⏱ Ude på optagelse</option>'
    +'<option value="savnet"'+(c.status==='savnet'?' selected':'')+'>⚠ Savnet</option>'
    +'</select></div>'
    +'<div class="form-field"><label class="form-label">Fotograf</label><select class="form-select" id="m-photo">'+photoOpts+'</select></div>'
    +'<div class="form-field"><label class="form-label">Eller skriv nyt navn</label><input class="form-input" type="text" id="m-photo-new" placeholder="Nyt fotografnavn"></div>'
    +'<div class="form-field"><label class="form-label">Produktion</label><input class="form-input" type="text" id="m-project" value="'+(c.project||'')+'"></div>'
    +'<div class="form-field"><label class="form-label">Noter</label><input class="form-input" type="text" id="m-notes" value="'+(c.notes||'')+'"></div>'
    +'<div class="modal-footer">'
    +'<button class="btn btn-danger" onclick="deleteCard(\''+id+'\')">Slet kort</button>'
    +'<button class="btn" onclick="closeModal()">Annuller</button>'
    +'<button class="btn btn-accent" onclick="saveCard(\''+id+'\')">Gem ændringer</button>'
    +'</div></div></div>';
}

async function saveCard(id) {
  var c = cards.find(function(x) { return x.id === id; });
  var newStatus = document.getElementById('m-status').value;
  var newPhotoNew = document.getElementById('m-photo-new').value.trim();
  var newPhoto = newPhotoNew || document.getElementById('m-photo').value;
  var newProject = document.getElementById('m-project').value.trim();
  var newNotes = document.getElementById('m-notes').value.trim();
  if (newPhotoNew && photographers.indexOf(newPhotoNew) === -1) {
    await sbFetch('/photographers?on_conflict=name', 'POST', {name: newPhotoNew}, {'Prefer': 'return=representation,resolution=merge-duplicates'});
    photographers.push(newPhotoNew);
  }
  var updated = {id:id, status:newStatus, photographer:newPhoto, project:newProject, notes:newNotes, since:nextSince(c.status, c.since, newStatus), cap:c.cap};
  setSyncing(true);
  var r = await sbFetch('/cards?on_conflict=id', 'POST', updated, {'Prefer': 'return=representation,resolution=merge-duplicates'});
  if (!r.ok) { setSyncing(false); showError('Kunne ikke gemme kort'); return; }
  await sbFetch('/activity_log', 'POST', {card_id:id, action:newStatus==='ude'?'udlaan':newStatus==='ledig'?'returneret':'savnet', photographer:newPhoto, project:newProject}, {'Prefer': 'return=representation'});
  var ra = await sbFetch('/cards?order=id');
  var rb = await sbFetch('/activity_log?order=ts.desc&limit=200');
  cards = await ra.json();
  activityLog = await rb.json();
  setSyncing(false);
  closeModal();
  renderAll();
}

async function deleteCard(id) {
  if (!confirm('Slet ' + id + ' permanent?')) return;
  setSyncing(true);
  await sbFetch('/cards?id=eq.' + id, 'DELETE');
  await sbFetch('/activity_log', 'POST', {card_id:id, action:'slettet', photographer:'', project:''}, {'Prefer': 'return=representation'});
  cards = cards.filter(function(c) { return c.id !== id; });
  setSyncing(false);
  closeModal();
  renderAll();
}

// ── Add card ──────────────────────────────────────────────
function openAddCard() {
  document.getElementById('modal-area').innerHTML =
    '<div class="modal-overlay" onclick="closeModal(event)">'
    +'<div class="modal" onclick="event.stopPropagation()">'
    +'<div class="modal-header"><div class="modal-title">Tilføj nyt SD-kort</div>'
    +'<button class="btn" onclick="closeModal()" style="padding:6px 10px;">&#10005;</button></div>'
    +'<div class="form-field"><label class="form-label">Kort-ID</label>'
    +'<input class="form-input" type="text" id="a-id" placeholder="SD-009" oninput="this.value=this.value.toUpperCase()"></div>'
    +'<div class="form-field"><label class="form-label">Kapacitet</label>'
    +'<select class="form-select" id="a-cap"><option>32GB</option><option>64GB</option><option selected>128GB</option><option>256GB</option><option>512GB</option><option>1TB</option></select></div>'
    +'<div class="form-field"><label class="form-label">Noter</label>'
    +'<input class="form-input" type="text" id="a-notes" placeholder="Mærke, serienummer..."></div>'
    +'<div class="modal-footer"><button class="btn" onclick="closeModal()">Annuller</button>'
    +'<button class="btn btn-accent" onclick="addCard()">Tilføj kort</button></div>'
    +'</div></div>';
}

async function addCard() {
  var id = document.getElementById('a-id').value.trim().toUpperCase();
  var cap = document.getElementById('a-cap').value;
  var notes = document.getElementById('a-notes').value.trim();
  if (!id) { alert('Indtast et kort-ID'); return; }
  if (cards.find(function(c) { return c.id === id; })) { alert(id + ' findes allerede'); return; }
  var card = {id:id, status:'ledig', photographer:'', project:'', since:new Date().toISOString().slice(0,10), cap:cap, notes:notes};
  setSyncing(true);
  var r = await sbFetch('/cards?on_conflict=id', 'POST', card, {'Prefer': 'return=representation,resolution=merge-duplicates'});
  if (!r.ok) { setSyncing(false); showError('Kunne ikke oprette kort'); return; }
  await sbFetch('/activity_log', 'POST', {card_id:id, action:'tilfojet', photographer:'', project:''}, {'Prefer': 'return=representation'});
  var ra = await sbFetch('/cards?order=id');
  cards = await ra.json();
  setSyncing(false);
  closeModal();
  renderAll();
}

// ── Scan (desktop) ────────────────────────────────────────
function openScan() {
  document.getElementById('modal-area').innerHTML =
    '<div class="modal-overlay" onclick="closeModal(event)">'
    +'<div class="modal" onclick="event.stopPropagation()">'
    +'<div class="modal-header"><div class="modal-title">Scan / Indtast kort-ID</div>'
    +'<button class="btn" onclick="closeModal()" style="padding:6px 10px;">&#10005;</button></div>'
    +'<div class="form-field"><label class="form-label">Kort-ID</label>'
    +'<input class="form-input" type="text" id="scan-id" placeholder="SD-001" oninput="this.value=this.value.toUpperCase()" autofocus></div>'
    +'<div class="modal-footer"><button class="btn" onclick="closeModal()">Annuller</button>'
    +'<button class="btn btn-accent" onclick="doDesktopScan()">Find kort</button></div>'
    +'</div></div>';
  setTimeout(function() { var el = document.getElementById('scan-id'); if (el) el.focus(); }, 100);
}

function doDesktopScan() {
  var id = document.getElementById('scan-id').value.trim().toUpperCase();
  var c = cards.find(function(x) { return x.id === id; });
  if (!c) { alert('Kort ' + id + ' ikke fundet'); return; }
  closeModal();
  setTimeout(function() { openCardModal(id); }, 50);
}

function closeModal(e) {
  if (e && !e.target.classList.contains('modal-overlay')) return;
  document.getElementById('modal-area').innerHTML = '';
}

// ── Mobile scan landing ───────────────────────────────────
function checkForScanParam() {
  var params = new URLSearchParams(window.location.search);
  var kortId = params.get('kort');
  if (!kortId) return false;

  // Byg overlay
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;font-family:var(--sans);color:var(--text);';
  overlay.innerHTML =
    '<div style="width:100%;max-width:400px;">'
    +'<div style="text-align:center;margin-bottom:28px;">'
    +'<div class="bermuda-logo" role="img" aria-label="Bermuda" style="width:64px;margin:0 auto 12px;"></div>'
    +'<div style="font-size:20px;font-weight:600;margin-bottom:6px;">SD Tracker</div>'
    +'<div style="font-size:13px;color:var(--text2);">Henter ' + kortId + '&hellip;</div>'
    +'</div>'
    +'<div id="scan-box" style="background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:24px;">'
    +'<div style="text-align:center;color:var(--text2);padding:20px;">Forbinder&hellip;</div>'
    +'</div></div>';
  document.body.appendChild(overlay);

  // Hent kortet
  sbFetch('/cards?id=eq.' + encodeURIComponent(kortId))
    .then(function(r) { return r.json(); })
    .then(function(arr) {
      if (!arr.length) {
        document.getElementById('scan-box').innerHTML = '<div style="text-align:center;color:var(--red);padding:20px;">Kort <strong>' + kortId + '</strong> findes ikke.</div>';
        return;
      }
      renderMobileScan(arr[0]);
    })
    .catch(function(e) {
      document.getElementById('scan-box').innerHTML = '<div style="text-align:center;color:var(--red);padding:16px;">Kunne ikke forbinde.<br><small style="color:var(--text2);">' + e.message + '</small></div>';
    });

  return true;
}

function renderMobileScan(card) {
  var isUde = card.status === 'ude';
  var isSavnet = card.status === 'savnet';
  var statusFg = isUde ? 'var(--amber)' : isSavnet ? 'var(--red)' : 'var(--green)';
  var statusBg = isUde ? 'var(--amber-dim)' : isSavnet ? 'var(--red-dim)' : 'var(--green-dim)';
  var statusLabel = isUde ? 'Ude på optagelse' : isSavnet ? 'Savnet' : 'Ledig';

  var html =
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
    +'<div style="font-family:monospace;font-size:24px;font-weight:700;">'+card.id+'</div>'
    +'<span style="background:'+statusBg+';color:'+statusFg+';font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;">'+statusLabel+'</span>'
    +'</div>'
    +'<div style="font-size:12px;color:var(--text2);font-family:monospace;margin-bottom:20px;">'+card.cap+'</div>';

  if ((isUde || isSavnet) && card.project) {
    html += '<div style="font-size:13px;color:var(--text);margin-bottom:6px;">Aktuel produktion: <strong>'+card.project+'</strong></div>';
  }
  if ((isUde || isSavnet) && card.since) {
    html += '<div style="font-size:12px;color:var(--text2);margin-bottom:16px;">Udlånt '+fmtDate(card.since)+' · '+daysSince(card.since)+'</div>';
  }

  html +=
    '<label style="font-size:11px;font-family:monospace;text-transform:uppercase;letter-spacing:0.06em;color:var(--text2);display:block;margin-bottom:8px;">Produktion</label>'
    +'<input id="scan-project" type="text" value="'+(card.project||'')+'" '
    +'style="width:100%;box-sizing:border-box;background:#fff;border:1px solid var(--border2);border-radius:12px;color:var(--text);font-size:16px;padding:14px;font-family:var(--sans);outline:none;margin-bottom:20px;" '
    +'placeholder="Hvilken produktion?">';

  if (isUde || isSavnet) {
    html +=
      '<button id="btn-aflever" style="width:100%;background:var(--green);color:#fff;border:none;border-radius:14px;padding:16px;font-family:var(--sans);font-size:17px;font-weight:700;cursor:pointer;margin-bottom:10px;">&#10003; Aflev&eacute;r kort</button>'
      +'<button id="btn-savnet" style="width:100%;background:transparent;color:var(--red);border:1px solid #f2b9ad;border-radius:14px;font-family:var(--sans);padding:13px;font-size:14px;cursor:pointer;">&#9888; Meld savnet</button>';
  } else {
    html +=
      '<button id="btn-registrer" style="width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:16px;font-family:var(--sans);font-size:17px;font-weight:700;cursor:pointer;">&#8594; Registr&eacute;r kort</button>';
  }

  var box = document.getElementById('scan-box');
  box.innerHTML = html;
  box.dataset.cardId = card.id;
  box.dataset.cap = card.cap;
  box.dataset.status = card.status;
  box.dataset.since = card.since || '';

  // Direkte event listeners på knapperne — ingen inline onclick, ingen delegation
  var btnA = document.getElementById('btn-aflever');
  var btnS = document.getElementById('btn-savnet');
  var btnR = document.getElementById('btn-registrer');
  
  if (btnA) btnA.addEventListener('click', function() { submitMobileScan(card.id, 'returneret'); });
  if (btnS) btnS.addEventListener('click', function() { submitMobileScan(card.id, 'savnet'); });
  if (btnR) btnR.addEventListener('click', function() { submitMobileScan(card.id, 'udlaan'); });

  // Fokus
  var inp = document.getElementById('scan-project');
  if (inp && !card.project) setTimeout(function() { inp.focus(); }, 150);
}

function submitMobileScan(kortId, action) {
  var projectEl = document.getElementById('scan-project');
  var project = projectEl ? projectEl.value.trim() : '';

  if (action === 'udlaan' && !project) {
    if (projectEl) {
      projectEl.style.borderColor = 'var(--red-line)';
      projectEl.style.boxShadow = '0 0 0 2px rgba(242,85,60,0.25)';
      projectEl.focus();
      setTimeout(function() { projectEl.style.borderColor = 'var(--border2)'; projectEl.style.boxShadow = 'none'; }, 2500);
    }
    return;
  }

  // Vis feedback med det samme
  var btns = document.querySelectorAll('#scan-box button');
  btns.forEach(function(b) { b.disabled = true; b.style.opacity = '0.5'; });

  var status = action === 'udlaan' ? 'ude' : action === 'returneret' ? 'ledig' : 'savnet';
  var cap = document.getElementById('scan-box').dataset.cap || '128GB';
  var sbox = document.getElementById('scan-box');
  var since = nextSince(sbox.dataset.status, sbox.dataset.since, status);

  var cardData = {id: kortId, status: status, project: project, photographer: '', since: since, notes: '', cap: cap};

  sbFetch('/cards?on_conflict=id', 'POST', cardData, {'Prefer': 'return=representation,resolution=merge-duplicates'})
    .then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
      return sbFetch('/activity_log', 'POST', {card_id: kortId, action: action, photographer: '', project: project}, {'Prefer': 'return=representation'});
    })
    .then(function() {
      var color  = action === 'udlaan' ? 'var(--accent)' : action === 'returneret' ? 'var(--green)' : 'var(--red)';
      var icon   = action === 'savnet' ? '&#9888;&#65039;' : '&#10003;';
      var msg    = action === 'udlaan' ? 'Kort registreret!' : action === 'returneret' ? 'Kort afleveret!' : 'Kort meldt savnet';
      document.getElementById('scan-box').innerHTML =
        '<div style="text-align:center;padding:32px 0;">'
        +'<div style="font-size:64px;margin-bottom:16px;line-height:1;">'+icon+'</div>'
        +'<div style="font-size:22px;font-weight:700;color:'+color+';margin-bottom:10px;">'+msg+'</div>'
        +'<div style="font-size:14px;color:var(--text2);">'+kortId+(project ? ' &middot; '+project : '')+'</div>'
        +'</div>';
    })
    .catch(function(e) {
      btns.forEach(function(b) { b.disabled = false; b.style.opacity = '1'; });
      var errDiv = document.createElement('div');
      errDiv.style.cssText = 'background:var(--red-dim);color:var(--red);border-radius:12px;padding:12px;font-size:13px;margin-bottom:14px;';
      errDiv.textContent = 'Fejl: ' + e.message;
      document.getElementById('scan-box').prepend(errDiv);
      setTimeout(function() { errDiv.remove(); }, 6000);
    });
}

// ── Render all ────────────────────────────────────────────
function renderAll() {
  renderStats();
  renderCards();
  if (currentView === 'log') renderLog();
  if (currentView === 'qr') renderQR();
  if (currentView === 'fotografer') renderPhotographers();
  if (currentView === 'ledig' || currentView === 'ude' || currentView === 'savnet') renderFilteredCards(currentView);
}

// ── Init ──────────────────────────────────────────────────
document.getElementById('footer-date').textContent = new Date().toLocaleDateString('da-DK', {day:'numeric', month:'long', year:'numeric'});

if (!checkForScanParam()) {
  loadAll();
}
</script>
</body>
</html>
